<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F20"/>
      <stop offset="1" stop-color="#1A2A6C"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#66F5D8"/>
      <stop offset="0.55" stop-color="#3A9BFF"/>
      <stop offset="1" stop-color="#4B4CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="50%">
      <stop offset="0" stop-color="#3A9BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3A9BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="370" r="270" fill="url(#glow)"/>

  <!-- капля -->
  <path d="M320 84 C320 84 164 262 164 384 C164 472 233 540 320 540 C407 540 476 472 476 384 C476 262 320 84 320 84 Z"
        fill="url(#drop)"/>
  <!-- блик -->
  <path d="M230 360 C230 318 252 276 286 236" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="16" stroke-linecap="round"/>

  <!-- сеть внутри капли: три узла = цепочка прокси -->
  <g stroke="#0A0F20" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M268 410 L372 352"/>
    <path d="M372 352 L350 466"/>
    <path d="M268 410 L350 466"/>
  </g>
  <g fill="#0A0F20">
    <circle cx="268" cy="410" r="30"/>
    <circle cx="372" cy="352" r="30"/>
    <circle cx="350" cy="466" r="30"/>
  </g>
  <g fill="#66F5D8">
    <circle cx="268" cy="410" r="11"/>
    <circle cx="372" cy="352" r="11"/>
    <circle cx="350" cy="466" r="11"/>
  </g>
</svg>
